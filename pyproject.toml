[project]
name = "kosto"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "customtkinter == 5.2.2",
]

[dependency-groups]
dev = [
    "pyinstaller == 6.20.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
