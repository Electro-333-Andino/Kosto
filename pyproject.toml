[project]
name = "kosto"
version = "0.1.0"
description = "Sistema profesional de gestión de inventario Kosto."
readme = "README.md"
requires-python = "==3.12.*"
license = "Apache-2.0"
dependencies = [
    "customtkinter == 5.2.2",
]

[dependency-groups]
dev = [
    "pyinstaller == 6.20.0",
    "ruff>=0.15.16",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
